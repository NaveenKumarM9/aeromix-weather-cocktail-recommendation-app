services:
  database:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: cocktail_weather
      POSTGRES_USER: cocktail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocktail -d cocktail_weather"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  application:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://database:5432/cocktail_weather
      DATABASE_USERNAME: cocktail
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      DEFAULT_CITY: Chicago
      MANAGEMENT_PORT: 8081
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
