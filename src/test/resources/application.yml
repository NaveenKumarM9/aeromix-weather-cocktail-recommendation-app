spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:mem:cocktail-weather-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  weather:
    forecast-base-url: https://api.open-meteo.com/v1/forecast
    geocoding-base-url: https://geocoding-api.open-meteo.com/v1/search
    api-key:
    default-city: Chicago
    cache-minutes: 10
  recommendations:
    default-limit: 6
    maximum-limit: 12
