apiVersion: apps/v1
kind: Deployment
metadata:
  name: cocktail-weather
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cocktail-weather
  template:
    metadata:
      labels:
        app: cocktail-weather
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: application
          image: your-registry/cocktail-weather:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: management
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: MANAGEMENT_PORT
              value: "8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cocktail-weather-database
                  key: url
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cocktail-weather-database
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cocktail-weather-database
                  key: password
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cocktail-weather
spec:
  selector:
    app: cocktail-weather
  ports:
    - port: 80
      targetPort: 8080
